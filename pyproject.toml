[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laxforge"
version = "0.1.0"
description = "Gauge-aware discovery engine for zero-curvature representations and Lax pairs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sympy>=1.12",
  "networkx>=3.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
