name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Build calibration artifacts
        run: python scripts/export_laxcert_calibration.py runs/laxcert_calibration --overwrite

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            runs/laxcert_calibration/laxforge_manifest.json
            runs/laxcert_calibration/candidate.json
            runs/laxcert_calibration/source_report.json
