name: Calibration Artifact Smoke Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  artifact-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Export calibration artifacts
        run: python scripts/export_laxcert_calibration.py runs/laxcert_calibration --overwrite

      - name: Validate calibration artifacts
        run: python scripts/check_laxcert_artifacts.py

      - name: Upload calibration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laxcert-calibration
          path: runs/laxcert_calibration/
